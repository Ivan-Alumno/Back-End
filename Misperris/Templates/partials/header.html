<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="{% url 'inicio' %}">
            <span class="paw">🐾</span>
            <span>Mis Perris</span>
        </a>
        <nav class="main-nav" aria-label="Menú principal">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'adoptables' %}">Adoptables</a>
            {% if request.user.is_authenticated %}
                {% if request.user.is_superuser or perms.MascotasAPP.view_solicitudadopcion %}
                    <a href="{% url 'gestion_inicio' %}">Administración</a>
                {% endif %}
                <span class="nav-user">Hola, {{ request.user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="nav-logout">
                    {% csrf_token %}
                    <button class="nav-button" type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a class="nav-button" href="{% url 'login' %}">Iniciar sesión</a>
            {% endif %}
        </nav>
    </div>
</header>
