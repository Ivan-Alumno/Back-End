{% load static %}
<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Galería de mascotas</title>
        <link rel="stylesheet" href="{% static 'CSS/Index.css' %}">
    </head>

    <body>
        <header class="site-header">
            <div class="container header-inner">
                <div class="logo">
                    <span class="paw">🐾</span>
                    <span>Mis Perris</span>
                </div>

                <nav class="main-nav" aria-label="Menú principal">
                    <a href="{% url 'index' %}">Inicio</a>
                    <a href="{% url 'galeria' %}">Galería</a>
                    <a href="#">Formulario</a>
                    <a href="#">Quienes Somos</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="section" id="mascotas">
                <div class="container">
                    <h2 class="gallery-title">Galería de mascotas</h2>
                    <div class="pet-grid">
                        {% for mascota in mascotas %}
                        <article class="pet-card">
                            <img src="{{ mascota.foto }}" alt="{{ mascota.nombre }}">
                            <div class="pet-info">
                                <h3>{{ mascota.nombre }}</h3>
                                <p><strong>Raza:</strong> {{ mascota.raza }}</p>
                                <p>{{ mascota.descripcion }}</p>
                            </div>
                        </article>
                        {% endfor %}
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                © 2026 Mis Perris · Todos los derechos reservados
            </div>
        </footer>
    </body>
    
</html>
